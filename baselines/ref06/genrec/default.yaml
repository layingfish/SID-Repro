num_proc: 1
cache_dir: cache/
log_dir: logs/
tensorboard_log_dir: tensorboard/
ckpt_dir: ckpt/
run_id: genrec_default
rand_seed: 2024
reproducibility: True

train_batch_size: 256
eval_batch_size: 32
lr: 0.0003
weight_decay: 0.0
warmup_steps: 10000
steps: ~
epochs: 100
max_grad_norm: 1.0
eval_interval: 1
patience: 10

topk: [5,10]
metrics: [ndcg,recall]
val_metric: ndcg@10
