protocol: rq1_method_native_main_table
scope: >
  RQ1 does not force every method into a shared SID tokenizer or shared decoder.
  Each entry records the native encoder, SID construction, decoder, and export
  setting used by that method. Shared evaluation is defined in
  configs/experiment/rq1_overall.yaml.

reference_item_embedding:
  setrec_text_source: sentence-transformers/sentence-t5-base
  setrec_text_dim: 768
  file_template: ${DATA_ROOT}/setrec_data/${dataset}/${dataset}.emb-t5-tdcb.npy

methods:
  TIGER:
    code: baselines/decoder
    sid_family: rqvae
    input_embedding: sentence_t5_item_text
    input_dim: 768
    rqvae_hidden_dims: [512, 256, 128]
    rqvae_embed_dim: 32
    rqvae_n_layers: 3
    rqvae_codebook_size: 256
    decoder: reference_tiger_decoder
    duplicate_policy: suffix
    submitted_backbone: t5-small

  HowToIndex:
    code: baselines/ref02
    sid_family: howtoindex_semid
    variant: semid
    item_representation: content_based
    data_order: random
    backbone: t5-small
    epochs: 20
    lr: 0.001
    warmup_prop: 0.05
    clip: 1.0
    train_sequential_item_batch: 64
    train_sequential_yesno_batch: 16
    train_direct_yesno_batch: 16
    train_direct_candidate_batch: 8
    train_direct_straightforward_batch: 16
    export_script: test_only_llm_id.py

  RPG:
    code: baselines/ref04
    sid_family: opq_pq_parallel_sid
    sent_emb_model: setrec_t5_tdcb
    sent_emb_dim: 768
    sent_emb_pca: 0
    codebook_size: 256
    train_batch_size: 256
    eval_batch_size: 32
    epochs: 150
    sent_emb_batch_size: 512
    tokenizer_factory: OPQ{n_codebook},IVF1,PQ{n_codebook}x8
    decoder: rpg_native_generator
    graph_propagation: true
    submitted_main_datasets:
      microlens_50k:
        n_codebook: 64
        lr: 0.001
        num_beams: 20
        n_edges: 500
        propagation_steps: 5
      amazon23_vg:
        n_codebook: 64
        lr: 0.001
        num_beams: 20
        n_edges: 500
        propagation_steps: 5
      yelp:
        n_codebook: 64
        lr: 0.001
        num_beams: 20
        n_edges: 500
        propagation_steps: 5
    reference_domain_grid:
      n_codebook: [16, 32, 64]
      lr: [0.001, 0.003, 0.01]
      temperature: 0.03
      num_beams: [20, 100, 200]
      n_edges: [20, 30, 200, 500]
      propagation_steps: [3, 5]

  LETTER-TIGER:
    code: baselines/ref03/LETTER-TIGER
    sid_family: letter_rqvae
    tokenizer_code: baselines/ref03/RQ-VAE
    input_embedding: sentence_t5_item_text
    auxiliary_cf_embedding: sasrec_item_embedding
    decoder: letter_tiger_t5
    backbone: t5-small
    per_device_batch_size: 256
    learning_rate: 0.0005
    epochs: 200
    temperature: 1.0
    num_beams: 20
    index_file: .index.json

  LETTER-LC-Rec:
    code: baselines/ref03/LETTER-LC-Rec
    sid_family: letter_rqvae
    tokenizer_code: baselines/ref03/RQ-VAE
    decoder: letter_lc_rec
    index_file: .index.json
    base_model: ${MODEL_ROOT}/llama-7b
    per_device_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 0.00002
    epochs: 1
    tasks: seqrec
    train_prompt_sample_num: 1
    train_data_sample_num: 0
    temperature: 1.0
    num_beams: 20

  SETRec:
    code: baselines/reference/code
    sid_family: setrec_t5
    semantic_encoder: t5
    backbone: t5-small
    n_sem: 4
    n_cf: 1
    alpha: 0.7
    n_query: 5
    layers: [512, 256, 128]
    batch_size: 512
    micro_batch_size: 128
    num_epochs: 30
    learning_rate: 0.001
    cutoff_len: 512
    val_set_size: 2000
    warmup_steps: 100
    lr_scheduler: cosine

  ETEGRec:
    code: baselines/ref07
    sid_family: end_to_end_rqvae
    semantic_embedding: setrec_t5_item_text
    semantic_embedding_dim: 768
    code_num: 4096
    code_length: 4
    num_emb_list: [256, 256, 256]
    epochs: 999
    early_stop: 50
    batch_size: 256
    eval_batch_size: 256
    config_template: baselines/ref07/config/setrec_<dataset>.yaml

  SEATER:
    code: baselines/ref01
    sid_family: tree_structured_sid
    dataset_name_template: SETRec_<dataset>
    model: SEATER
    vocab: 8
    epochs: 100
    batch_size: 256
    test_batch_size: 1024
    decoder: seater_native_generator

  EAGER:
    code: baselines/ref08
    sid_family: two_stream_behavior_semantic_tree
    behavior_embedding: din_item_embedding
    semantic_embedding: sentence_t5_item_text
    din_pretrain_step: 29000
    tree_num: 2
    k: 128
    d_model: 96
    enc_num_layers: 1
    dec_num_layers: [2, 2]
    n_head: 4
    init_way: [embkm, embkm]
    feature_ratio: 1.0
    max_iters: 100
    seed: 42
    train_batch_size: 256
    total_batch_num: 60000
    eval_step: 3000
    eval_topk: 10
    eval_rerank_topk: 10
    export_topk: 20
    export_rerank_topk: 20
    merge_method: sum_scores

  DiffGRM:
    code: baselines/ref06
    sid_family: opq_pq_diffusion
    sent_emb_model: setrec_t5_tdcb
    sent_emb_dim: 768
    sent_emb_pca: 256
    normalize_after_pca: true
    tokenizer_factory: OPQ4,IVF1,PQ4x8
    n_digit: 4
    sid_quantizer: opq_pq
    force_regenerate_opq: true
    masking_strategy: guided
    guided_select: least
    guided_conf_metric: msp
    train_sliding: true
    min_hist_len: 2
    share_decoder_output_embedding: true
    encoder_n_layer: 1
    decoder_n_layer: 4
    n_head: 4
    n_embd: 256
    n_inner: 1024
    warmup_steps: 10000
    dropout: 0.1
    label_smoothing: 0.1
    eval_start_epoch: 20
    eval_interval: 1
    patience: 15
    epochs: 100
    train_batch_size: 256
    eval_batch_size: 32

  SASRec:
    code: baselines/ref01/model/SASREC.py
    sid_family: none
    item_embedding_source: learned_from_interactions
    max_history_length: 50
    role: sequential_cf_baseline
    epochs: 50
    batch_size: 256
    test_batch_size: 1024
    random_seed: 2023
    dataset_adapter: seater_setrec

  OneRec:
    code: baselines/ref05
    sid_family: rq_kmeans
    input_embedding: sentence_t5_item_text
    codebook_size: 8192
    n_layers: 3
    assignment: balanced_residual_kmeans
    max_iter: 50
    nredo: 10
    search_topk: 32
    seed: 42
    code_path: baselines/ref05/onerec_v2
    launcher: scripts/rq1_native/repro_onerec.sh
    architecture: seq2seq
    session_size: 5
    max_hist: 256
    min_hist: 3
    batch_size: 16
    eval_batch_size: 16
    eval_generate_batch_size: 1
    learning_rate: 0.0002
    weight_decay: 0.01
    warmup_ratio: 0.05
    max_steps: 30000
    eval_every: 2000
    patience: 8
    eval_beam_size: 128
    eval_topk: 20
    stage2_ipa_dpo: not_used_in_main_table
