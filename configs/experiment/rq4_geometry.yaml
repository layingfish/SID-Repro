rq: RQ4
name: local_semantic_preservation
question: How do different semantic ID designs affect local item semantic preservation?

reference_space:
  embedding_file: ${DATA_ROOT}/setrec_data/amazon23_vg/amazon23_vg.emb-t5-tdcb.npy
  embedding_model: sentence-transformers/sentence-t5-base
  distance: cosine

sid_inputs:
  TIGER: ${TOKENIZER_ROOT}/TIGER/cached_ids.npy
  SEATER: ${TOKENIZER_ROOT}/SEATER/cached_ids.npy
  HowToIndex: ${TOKENIZER_ROOT}/HowToIndex/cached_ids.npy
  LETTER: ${TOKENIZER_ROOT}/LETTER/cached_ids.npy
  OPQ: ${TOKENIZER_ROOT}/OPQ/cached_ids.npy
  RQ-Kmeans: ${TOKENIZER_ROOT}/RQ-Kmeans/cached_ids.npy

distance_metrics:
  native:
    TIGER: prefix
    SEATER: prefix
    HowToIndex: prefix
    LETTER: prefix
    OPQ: hamming
    RQ-Kmeans: prefix
  drop_last_code_column:
    TIGER: true
    SEATER: true
    HowToIndex: false
    LETTER: true
    OPQ: true
    RQ-Kmeans: true
  dedup_suffix_policy: ignored_for_semantic_distance_when_present

main_metrics:
  neighbors_k: 20
  jaccard_overlap_at_k: true
  rank_biased_overlap_at_k:
    enabled: true
    persistence: 0.9

sampling:
  pair_samples: 100000
  triplet_samples: 50000
  anchor_samples: 128
  anchor_rank_topm: 200
  seed: 20260423

case_study:
  plot_anchor_item_ids: [18089]
  plot_context_k: 120
  plot_font_scale: 2.0
  output_formats: [pdf, png, svg]
  display_names:
    TIGER: TIGER
    SEATER: SEATER
    HowToIndex: HowToIndex
    LETTER: LETTER
    OPQ: OPQ
    RQ-Kmeans: RQ-Kmeans

command_template: >
  bash scripts/run_rq4.sh
  --reference_embeddings ${DATA_ROOT}/setrec_data/amazon23_vg/amazon23_vg.emb-t5-tdcb.npy
  --sid TIGER=${TOKENIZER_ROOT}/TIGER/cached_ids.npy
  --sid SEATER=${TOKENIZER_ROOT}/SEATER/cached_ids.npy
  --sid HowToIndex=${TOKENIZER_ROOT}/HowToIndex/cached_ids.npy
  --sid LETTER=${TOKENIZER_ROOT}/LETTER/cached_ids.npy
  --sid OPQ=${TOKENIZER_ROOT}/OPQ/cached_ids.npy
  --sid RQ-Kmeans=${TOKENIZER_ROOT}/RQ-Kmeans/cached_ids.npy
  --output_dir ${OUTPUT_DIR}
  --pair_samples 100000
  --triplet_samples 50000
  --anchor_samples 128
  --neighbors_k 20
  --plot_anchors 1
  --plot_anchor_item_ids 18089
  --plot_context_k 120
  --plot_method_order TIGER,SEATER,HowToIndex,LETTER,OPQ,RQ-Kmeans
  --plot_font_scale 2.0
  --paper_sid_metric native
  --native_metric_override TIGER=prefix
  --native_metric_override SEATER=prefix
  --native_metric_override HowToIndex=prefix
  --native_metric_override LETTER=prefix
  --native_metric_override OPQ=hamming
  --native_metric_override RQ-Kmeans=prefix
  --drop_last_override TIGER=true
  --drop_last_override SEATER=true
  --drop_last_override HowToIndex=false
  --drop_last_override LETTER=true
  --drop_last_override OPQ=true
  --drop_last_override RQ-Kmeans=true
  --seed 20260423
