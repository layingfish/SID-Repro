rq: RQ1
name: overall_benchmark
question: Which representative SID-based generative recommendation system performs better under a unified and reproducible generative recommendation framework?

protocol:
  training_and_decoding: method_native
  shared_components:
    - setrec_style_data_adapters
    - canonical_zero_based_item_ids
    - jsonl_prediction_export
    - unified_evaluator
  not_used_for_rq1:
    - ../decoder/main_table_decoder.yaml

methods:
  - TIGER
  - HowToIndex
  - RPG
  - LETTER-TIGER
  - LETTER-LC-Rec
  - SETRec
  - ETEGRec
  - SEATER
  - EAGER
  - DiffGRM
  - SASRec
  - OneRec

datasets:
  main: [microlens_50k, amazon23_vg, yelp]
  supported: [beauty, toys, sports, steam, microlens_50k, amazon23_vg, yelp]

data_config: ../data/setrec_splits.yaml
method_config: ../tokenizer/main_table_tokenizers.yaml

evaluation:
  modes: [full]
  top_n: [5, 10]
  strict_validation: true
  report_metrics: [Recall@5, Recall@10, NDCG@5, NDCG@10]
  warm_only_filter: [microlens_50k, amazon23_vg, yelp]
  ground_truth: multi_target_test_items
  cold_item_policy: remove_cold_ground_truth_items
  empty_ground_truth_policy: exclude_user_after_warm_filter
  evaluator: pipeline.evaluation.unified_eval
  prediction_format: jsonl
  export_helpers: scripts/exports

command_templates:
  native_train_or_decode: >
    bash scripts/run_rq1.sh native
    --method <method>
    --dataset <dataset>
    --variant <optional-variant>
    --run_dir ${RUN_ROOT}/rq1/<method>/<dataset>
  evaluate_exported_predictions: >
    bash scripts/run_rq1.sh evaluate
    --pred ${RUN_ROOT}/rq1/<method>/<dataset>/pred_topk.jsonl
    --dataset <dataset>
    --mode full
    --data_dir ${DATA_ROOT}/setrec_data
    --top_n 5,10
    --warm_only
    --output ${RUN_ROOT}/rq1/<method>/<dataset>/metrics_full.json

method_pipelines:
  TIGER:
    code: baselines/decoder
    native_protocol: rqvae_tokenizer_then_tiger_decoder
    train: train_rqvae.py followed by train_decoder.py
    decoder: reference_rqvae_recommender_decoder
    config_source: baselines/decoder/configs

  HowToIndex:
    code: baselines/ref02
    native_protocol: howtoindex_llm_recsys_id_semid
    train: main.py
    export: test_only_llm_id.py
    variant: semid

  RPG:
    code: baselines/ref04
    native_protocol: faiss_opq_pq_sid_plus_graph_propagation
    train_and_decode: main.py
    config_source: baselines/ref04/genrec/default.yaml

  LETTER-TIGER:
    code: baselines/ref03/LETTER-TIGER
    native_protocol: letter_rqvae_indices_plus_letter_tiger_decoder
    train: finetune.py
    decode: test.py

  LETTER-LC-Rec:
    code: baselines/ref03/LETTER-LC-Rec
    native_protocol: letter_indices_plus_lc_rec_decoder
    train: lora_finetune.py
    decode: test_only_lc.py

  SETRec:
    code: baselines/reference/code
    native_protocol: setrec_t5
    train: finetune_t5.py
    decode: scripts/exports/export_setrec_t5_topk.py

  ETEGRec:
    code: baselines/ref07
    native_protocol: end_to_end_rqvae_recommender
    train_and_decode: main.py
    config_source: baselines/ref07/config/setrec_<dataset>.yaml

  SEATER:
    code: baselines/ref01
    native_protocol: tree_structured_sid
    train_and_decode: main.py
    config_source: baselines/ref01/config

  EAGER:
    code: baselines/ref08
    native_protocol: two_stream_behavior_semantic_tree
    train_and_decode: train_rec_setrec.py
    optional_pretrain: train_din_setrec.py

  DiffGRM:
    code: baselines/ref06
    native_protocol: opq_pq_sid_with_diffusion_generator
    train_and_decode: main.py
    config_source: baselines/ref06/genrec/models/DIFF_GRM/config.yaml

  SASRec:
    code: baselines/ref01/model/SASREC.py
    native_protocol: sequential_cf_baseline
    train_and_decode: seater_sasrec_mode

  OneRec:
    code: baselines/ref05
    native_protocol: rq_kmeans_style_onerec_v2_pipeline
    train: python -m onerec_v2.train
    decode: python -m onerec_v2.generate
    launcher: scripts/rq1_native/repro_onerec.sh
    code_length: 3
    codebook_width: 8192
