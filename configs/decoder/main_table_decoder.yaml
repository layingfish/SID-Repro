protocol: controlled_tiger_no_uid_decoder
description: >
  Controlled decoder recipe used for manifest-based SID comparison in RQ3 and
  additional alignment studies. It is not the RQ1 main-table protocol, where
  each method keeps its native encoder and decoder.

dataset:
  name: amazon23_vg
  decoder_dataset_split: amazon23_vg_tiger_strict
  dataset_folder: ${DATA_ROOT}/decoder
  force_dataset_process: false

training:
  gin_config: baselines/decoder/configs/decoder_setrec_yelp_t5small_v2_lr3e4_paper.gin
  model_size: t5-small
  hf_model_path: ${MODEL_ROOT}/t5-small
  hf_local_files_only: true
  num_user_tokens: 0
  max_iterations: 5000
  checkpoint_selection: validation_ndcg@10
  save_model_every: 5000
  learning_rate: 0.0003
  weight_decay: 0.035
  batch_size: 64
  gradient_accumulate_every: 4
  vae_input_dim: 768
  vae_hidden_dims: [512, 256, 128]
  vae_embed_dim: 32
  vae_n_cat_feats: 0
  vae_codebook_size: 256
  vae_n_layers: 3
  wandb_logging: false
  amp: true
  mixed_precision_type: bf16

export:
  beam_size: 64
  num_return_sequences: 64
  topk_items: 20
  batch_size: 16
  force_num_user_tokens: 0
  warm_only_export: false

evaluation:
  mode: full
  top_n: [5, 10]
  warm_only: true
  strict: true
  metrics: [Recall, NDCG]
